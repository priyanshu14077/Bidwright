# Local stack. One Postgres server holds two databases:
#   bidwright  - owned by the Python service; shape changed only through Alembic
#   n8n        - n8n's own state; n8n never writes to bidwright, it calls the API
name: bidwright

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Passwords are passed through by name from .env (`make env` generates them); none is written here.
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD
      - BIDWRIGHT_DB_PASSWORD
      - BIDWRIGHT_APP_PASSWORD
      - BIDWRIGHT_STUDIO_PASSWORD
      - DB_POSTGRESDB_PASSWORD
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD
      - BIDWRIGHT_API_URL=http://host.docker.internal:8000
    ports:
      - "5679:5678"
    volumes:
      - ./data/inbox:/inbox

volumes:
  pgdata:
