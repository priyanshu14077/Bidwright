# Local PoC stack. One Postgres server holds two databases:
#   sog  - owned by the Python service; shape changed only through Alembic
#   n8n  - n8n's own state; n8n never writes to sog, it calls the API
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      SOG_DB_PASSWORD: ${SOG_DB_PASSWORD:-sog}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      SOG_PRISMA_PASSWORD: ${SOG_PRISMA_PASSWORD:-sog_prisma}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      SOG_API_URL: http://host.docker.internal:8000
    ports:
      - "5679:5678"
    volumes:
      - ./data/inbox:/inbox

volumes:
  pgdata:
