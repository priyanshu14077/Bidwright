[project]
name = "sog"
version = "0.1.0"
description = "SOG RFP Intelligence Platform: intake, extraction and reference engine"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "anthropic>=0.70",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pymupdf>=1.25",
  "rapidfuzz>=3.10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4.2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
